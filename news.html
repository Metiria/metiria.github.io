---
layout: simple
tab: News
title: News & Articles
subtitle: Acknowledgements of our results
---

<section class="news-section">
    <div class="container">
        
        <!-- Cards' grid -->
        <div class="news-grid">
        
            {% for post in site.posts %}
            
                <!-- Card with automatically generated link to single news page -->
                <a href="{{ post.url | relative_url }}" class="news-card">
                
                    <!-- Background-image and overlay-->
                    <div class="news-image" style="background-image: url('{{ post.cover_image | relative_url }}');"></div>
                    <div class="news-overlay"></div>
                
                    <!-- Card content -->
                    <div class="news-content">
                        <h3 class="news-title">{{ post.title }}</h3>
                        {% if post.source %}
                            <p class="news-source">
                                <i class="fas fa-newspaper"></i> {{ post.source }}
                            </p>
                        {% endif %}
                        <p class="news-date">
                            {{ post.date | date: "%B %d, %Y" | upcase }} <span class="read-more">/ READ MORE &rarr;</span>
                        </p>
                    </div>
                </a>

            {% endfor %}

        </div>
    </div>
</section>
